name: consulting-backend

services:
  app:
    image: consulting-backend-app:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - /etc/consulting/backend.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: dr_chizari_bot_db
      DB_PORT: "3306"
      QUEUE_CONNECTION: database
      DB_QUEUE: default
      DB_QUEUE_RETRY_AFTER: "120"
      REDIS_CLIENT: phpredis
      REDIS_HOST: dr_chizari_bot_redis
      REDIS_PORT: "6379"
      REDIS_PREFIX: "consulting:"
      CACHE_PREFIX: "consulting:cache:"
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - internal
      - existing_services
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: consulting-backend-web:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
  existing_services:
    external: true
    name: dr-chizari-store-bot-v310-docker_bot-network

volumes:
  laravel_storage:
